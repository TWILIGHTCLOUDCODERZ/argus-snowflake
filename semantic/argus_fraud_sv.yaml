      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
  - name: ALERTS_TO_ACCOUNTS
    left_table: ALERTS
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - name: EVIDENCE_TO_ACCOUNTS
    left_table: EVIDENCE
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ENTITY_ID
        right_column: ACCOUNT_ID
  - name: HUB_TO_ACCOUNTS
    left_table: HUB_ACCOUNTS
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - name: LOGINS_TO_ACCOUNTS
    left_table: LOGINS
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - name: STRUCTURING_TO_ACCOUNTS
    left_table: STRUCTURING
    right_table: ACCOUNTS
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - name: TXN_TO_ACCOUNTS
    left_table: TRANSACTIONS
    right_table: ACCOUNTS
    relationship_columns:
